prefix: ""
mgmt:
  network: oob
  ipv4-subnet: 172.100.100.0/24

name: ros
topology:
  nodes:

    c1:
      kind: mikrotik_ros
      mgmt-ipv4: 172.100.100.3
      image: rpchan44/routeros:7.24rc2
      memory: 128Mb

    c2:
      kind: mikrotik_ros
      mgmt-ipv4: 172.100.100.4
      image: rpchan44/routeros:7.24rc2
      memory: 128Mb

    c3:
      kind: mikrotik_ros
      mgmt-ipv4: 172.100.100.5
      image: rpchan44/routeros:7.24rc2
      memory: 128Mb

    sw1:
      kind: mikrotik_ros
      mgmt-ipv4: 172.100.100.6
      image: rpchan44/routeros:7.24rc2
      memory: 128Mb

    sw2:
      kind: mikrotik_ros
      mgmt-ipv4: 172.100.100.7
      image: rpchan44/routeros:7.24rc2
      memory: 128Mb

    sw3:
      kind: mikrotik_ros
      mgmt-ipv4: 172.100.100.8
      image: rpchan44/routeros:7.24rc2
      memory: 128Mb

    sw4:
      kind: mikrotik_ros
      mgmt-ipv4: 172.100.100.9
      image: rpchan44/routeros:7.24rc2
      memory: 128Mb
    
    auth-server:
      kind: linux
      image: rpchan44/802.1x-fr:latest
      mgmt-ipv4: 172.100.100.2
      exec:
        - ip addr add 192.168.100.1/24 dev eth1
        - ip link set eth1 up
        - ip route add 192.168.20.0/24 dev eth1 via 192.168.100.254
        - ip route add 192.168.30.0/24 dev eth1 via 192.168.100.254
        - ip route add 192.168.40.0/24 dev eth1 via 192.168.100.254
      binds:
        - ./entrypoint.sh:/entrypoint.sh
      env:
        MAC1: AA:C1:AB:E9:EA:C7
        VLAN1: 20
        MAC2: 4C:5E:0C:AA:BB:02
        VLAN2: 30
        MAC3: 4C:5E:0C:AA:BB:03
        VLAN3: 40
      ports:
        - "1812:1812/udp"
        - "1813:1813/udp"


  links:

    - endpoints: [ "sw1:ether2", "sw2:ether2" ]
      
    - endpoints: [ "sw1:ether3", "sw2:ether3" ]

    - endpoints: [ "sw1:ether4", "c1:ether2" ]

    - endpoints: [ "sw2:ether4", "sw3:ether3" ]

    - endpoints: [ "sw2:ether5", "sw3:ether4" ]

    - endpoints: [ "sw2:ether6", "auth-server:eth1" ]

    - endpoints: [ "sw3:ether5", "c2:ether2" ]

    - endpoints: [ "sw2:ether7", "sw4:ether2" ]

    - endpoints: [ "sw2:ether8", "sw4:ether3" ]

    - endpoints: [ "sw4:ether4", "c3:ether2" ]
